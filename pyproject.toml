[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etekcity-scale-daemon"
version = "0.1.0"
description = "Standalone BLE daemon that logs Etekcity smart scale measurements to SQLite"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "etekcity_esf551_ble>=0.8.0,<1.0.0",
    "bleak>=2.0.0,<4.0.0",
    "reportlab>=4.0.0,<5.0.0",
    "aiomqtt>=2.0.0,<3.0.0",
    "apprise>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/bonelifer/etekcity-scale-daemon"

[project.scripts]
etekcity-scale-daemon = "etekcity_scale_daemon.cli:main"
etekcity-scale-report = "etekcity_scale_daemon.report:main"
etekcity-scale-prune = "etekcity_scale_daemon.prune:main"
etekcity-scale-alert-check = "etekcity_scale_daemon.alerting:main"
etekcity-scale-api = "etekcity_scale_daemon.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etekcity_scale_daemon"]
